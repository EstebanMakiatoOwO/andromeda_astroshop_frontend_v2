@if (storeConfig.ecommerceEnabled()) {

  <app-hero-carousel />

  <app-category-tabs-section />

  @if (!auth.isAuthenticated()) {
    <app-loyalty-banner />
  }

  <app-product-carousel
    title="Lo más buscado"
    subtitle="Los favoritos de nuestra comunidad"
    [products]="popularProducts()"
  />

  @if (isLoadingNew() || newProducts().length > 0) {
    <div class="bg-surface-2 border-t border-b border-line">
      <app-product-carousel
        title="Recién llegados"
        subtitle="Lo último que entró al catálogo"
        [products]="newProducts()"
      />
    </div>
  }

  <app-editorial-section
    [articles]="articles()"
    [isLoading]="isLoadingArticles()"
  />

  <app-brands-section [brands]="brands()" />

} @else {

  <app-landing-home />

}
