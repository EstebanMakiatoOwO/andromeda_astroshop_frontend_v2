<section class="max-w-7xl mx-auto px-4 md:px-8 py-8 md:py-12">

  <!-- Header -->
  <div class="flex items-end justify-between mb-6">
    <div class="flex flex-col gap-1">
      <h2 class="text-xl md:text-2xl font-bold text-ink-1">{{ title() }}</h2>
      @if (subtitle()) {
        <small class="text-xs text-ink-3">{{ subtitle() }}</small>
      }
    </div>
    <div class="flex items-center gap-2">
      <button (click)="scroll(-1)" [disabled]="!canPrev()"
              class="w-8 h-8 rounded-full border border-line flex items-center justify-center
                     text-ink-2 hover:border-accent hover:text-ink-1 transition-colors
                     disabled:opacity-30 disabled:cursor-not-allowed text-base">
        ‹
      </button>
      <button (click)="scroll(1)" [disabled]="!canNext()"
              class="w-8 h-8 rounded-full border border-line flex items-center justify-center
                     text-ink-2 hover:border-accent hover:text-ink-1 transition-colors
                     disabled:opacity-30 disabled:cursor-not-allowed text-base">
        ›
      </button>
      <a class="font-mono text-xs ml-2 cursor-pointer hover:underline"
         style="color:var(--color-accent)">
        catálogo completo →
      </a>
    </div>
  </div>

  <!-- Scroll container -->
  <div #scroller (scroll)="onScroll()"
       class="flex gap-5 overflow-x-auto pb-3
              [scrollbar-width:thin]
              [&::-webkit-scrollbar]:h-1
              [&::-webkit-scrollbar-track]:rounded-full [&::-webkit-scrollbar-track]:bg-surface-3
              [&::-webkit-scrollbar-thumb]:rounded-full [&::-webkit-scrollbar-thumb]:bg-line">
    @for (p of products(); track p.id) {
      <div class="flex-none w-64 scroll-snap-start">
        <app-product-card [product]="p" />
      </div>
    }
    @if (products().length === 0) {
      @for (s of [1,2,3,4]; track s) {
        <div class="flex-none w-64 flex flex-col gap-2 animate-pulse">
          <div class="aspect-square rounded-md bg-surface-3"></div>
          <div class="h-2.5 w-16 rounded bg-surface-3"></div>
          <div class="h-3 w-full rounded bg-surface-3"></div>
          <div class="h-4 w-20 rounded bg-surface-3"></div>
        </div>
      }
    }
  </div>

</section>
