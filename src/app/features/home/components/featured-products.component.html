<section id="productos" class="max-w-7xl mx-auto px-4 md:px-8 py-8 md:py-14">

  <!-- Header -->
  <div class="flex items-end justify-between mb-6 md:mb-8">
    <div class="flex flex-col gap-1">
      <h2 class="text-xl md:text-2xl font-bold text-ink-1">Lo más buscado</h2>
      <small class="text-xs text-ink-3">Selección de la semana</small>
    </div>
    <a href="#" class="font-mono text-xs transition-colors shrink-0"
       style="color: var(--color-accent);">
      catálogo completo →
    </a>
  </div>

  <!-- Grid -->
  <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-3 md:gap-4">

    @if (isLoading()) {
      @for (s of skeletons; track $index) {
        <div class="rounded-xl border border-line bg-surface-3 overflow-hidden animate-pulse">
          <div class="aspect-square bg-surface-4"></div>
          <div class="p-3 flex flex-col gap-2">
            <div class="h-2.5 w-16 rounded bg-surface-4"></div>
            <div class="h-3 w-full rounded bg-surface-4"></div>
            <div class="h-3 w-3/4 rounded bg-surface-4"></div>
            <div class="h-4 w-20 rounded bg-surface-4 mt-1"></div>
          </div>
        </div>
      }
    } @else {
      @for (product of products(); track product.id) {
        <app-product-card [product]="product" />
      }

      @if (products().length === 0) {
        <div class="col-span-2 sm:col-span-3 lg:col-span-4 py-16 text-center text-ink-3 text-sm">
          No hay productos disponibles por el momento.
        </div>
      }
    }

  </div>
</section>
