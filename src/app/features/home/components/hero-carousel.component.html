@if (loading()) {
  <div class="bg-surface-2 border-b border-line animate-pulse" style="aspect-ratio:3/2 ; width:100%"></div>
} @else if (slides().length === 0) {
  <div class="hidden"></div>
} @else {
  <div class="relative overflow-hidden border-b border-line w-full bg-black select-none aspect-9/16 md:aspect-16/5"
       (touchstart)="onTouchStart($event)"
       (touchend)="onTouchEnd($event)">

    <!-- Imágenes: todas renderizadas, fade con opacity -->
    @for (slide of slides(); track slide.id; let i = $index) {
      <div class="absolute inset-0 transition-opacity duration-500"
           [style.opacity]="i === current() ? '1' : '0'">
        @if (slide.linkUrl) {
          <a [href]="slide.linkUrl" class="block w-full h-full">
            <picture class="w-full h-full">
              <source media="(max-width: 767px)" [attr.srcset]="slide.mobile" />
              <img [src]="slide.desktop" [alt]="slide.title"
                   [attr.loading]="i === 0 ? 'eager' : 'lazy'"
                   class="w-full h-full object-cover" />
            </picture>
          </a>
        } @else {
          <picture class="block w-full h-full">
            <source media="(max-width: 767px)" [attr.srcset]="slide.mobile" />
            <img [src]="slide.desktop" [alt]="slide.title"
                 [attr.loading]="i === 0 ? 'eager' : 'lazy'"
                 class="w-full h-full object-cover" />
          </picture>
        }
      </div>
    }

    <!-- Flechas (solo sm+) -->
    @if (slides().length > 1) {
      <button (click)="prev()"
              class="hidden sm:flex absolute left-3 top-1/2 -translate-y-1/2 z-20 w-10 h-10 rounded-full
                     border border-white/30 bg-black/30 backdrop-blur-sm
                     items-center justify-center text-white hover:bg-black/50 transition-colors text-xl">
        ‹
      </button>
      <button (click)="next()"
              class="hidden sm:flex absolute right-3 top-1/2 -translate-y-1/2 z-20 w-10 h-10 rounded-full
                     border border-white/30 bg-black/30 backdrop-blur-sm
                     items-center justify-center text-white hover:bg-black/50 transition-colors text-xl">
        ›
      </button>

      <!-- Dots -->
      <div class="absolute bottom-3 left-1/2 -translate-x-1/2 z-20 flex items-center gap-2">
        @for (slide of slides(); track slide.id; let i = $index) {
          <button (click)="goTo(i)"
                  class="h-2.5 rounded-full transition-all duration-300 border-none cursor-pointer bg-white"
                  [style.width]="i === current() ? '28px' : '10px'"
                  [style.opacity]="i === current() ? '1' : '0.45'"
                  [attr.aria-label]="'Banner ' + (i + 1)">
          </button>
        }
      </div>
    }

  </div>
}
