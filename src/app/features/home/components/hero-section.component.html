<section class="relative overflow-hidden flex items-center border-b border-line"
         style="min-height: 320px; background: linear-gradient(180deg, var(--color-surface-2), var(--color-surface-1));">

  <!-- Star field -->
  <app-star-field class="absolute inset-0 z-0" [count]="80" [seed]="7" />

  <!-- Orbit rings — ocultas en móvil para no saturar -->
  <span class="hidden sm:block orbit"
        style="width: 800px; height: 800px; top: 50%; right: -300px; transform: translateY(-50%); opacity: 0.3;"></span>
  <span class="hidden sm:block orbit"
        style="width: 600px; height: 600px; top: 50%; right: -200px; transform: translateY(-50%);"></span>

  <!-- Content -->
  <div class="relative z-10 max-w-7xl mx-auto px-4 md:px-8 w-full py-12 md:py-16"
       style="min-height: inherit;">
    <div class="flex flex-col gap-4 md:gap-5 max-w-full md:max-w-115">
      <span class="font-mono text-xs text-accent">// catálogo 2026</span>
      <h1 class="font-bold text-ink-1 leading-none text-4xl md:text-5xl">
        Mirá el cielo<br>como nunca antes.
      </h1>
      <p class="text-sm text-ink-2 leading-relaxed max-w-sm">
        Equipamiento profesional para amateurs serios. Telescopios, monturas y accesorios con envío a todo el país.
      </p>
      <div class="flex flex-wrap gap-2">
        <a href="#productos"
           class="px-5 py-2.5 rounded-lg text-sm font-medium text-white transition-colors"
           style="background-color: var(--color-accent);"
           onmouseenter="this.style.backgroundColor='var(--color-accent-hover)'"
           onmouseleave="this.style.backgroundColor='var(--color-accent)'">
          Ver telescopios
        </a>
        <a href="#guias"
           class="px-5 py-2.5 rounded-lg border border-line text-sm text-ink-2
                  hover:text-ink-1 hover:border-accent transition-colors">
          Guía: tu primer telescopio
        </a>
      </div>
    </div>
  </div>
</section>
