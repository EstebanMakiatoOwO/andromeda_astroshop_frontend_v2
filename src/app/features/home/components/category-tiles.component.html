<section class="max-w-7xl mx-auto px-4 md:px-8 pt-10 md:pt-14">
  <div class="flex flex-wrap items-end justify-between gap-2 mb-6">
    <div class="flex flex-col gap-1">
      <h2 class="text-xl md:text-2xl font-bold text-ink-1">Compra por categoría</h2>
      <small class="text-xs text-ink-3">Todo lo que necesitas para observar y fotografiar el cielo</small>
    </div>
    <a routerLink="/catalogo" class="font-mono text-xs hover:underline" style="color:var(--color-accent)">
      ver todo →
    </a>
  </div>

  <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3 md:gap-4">
    @for (tile of tiles(); track tile.id) {
      <a [routerLink]="['/catalogo']" [queryParams]="{ cat: tile.id }"
         class="group relative overflow-hidden rounded-xl border border-line bg-surface-3 aspect-4/3">
        @if (tile.image) {
          <img [src]="tile.image | assetUrl" [alt]="tile.name" loading="lazy"
               class="absolute inset-0 w-full h-full object-cover transition-transform duration-500
                      group-hover:scale-105" />
        }
        <div class="absolute inset-0 bg-linear-to-t from-black/75 via-black/20 to-transparent"></div>
        <div class="absolute left-0 right-0 bottom-0 p-4 flex items-end justify-between gap-2">
          <div class="flex flex-col">
            <span class="text-base md:text-lg font-semibold text-white leading-tight">{{ tile.name }}</span>
            <span class="text-xs text-white/75">{{ tile.count }} producto{{ tile.count === 1 ? '' : 's' }}</span>
          </div>
          <span class="shrink-0 w-8 h-8 rounded-full bg-white/15 backdrop-blur-sm text-white flex items-center
                       justify-center transition-colors group-hover:bg-accent">→</span>
        </div>
      </a>
    }
  </div>
</section>
