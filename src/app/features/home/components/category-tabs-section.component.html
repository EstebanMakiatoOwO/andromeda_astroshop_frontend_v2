<!-- Header con tabs — mismo padding que el carousel -->
<div class="max-w-7xl mx-auto px-4 md:px-8 pt-8 md:pt-12 pb-0">
  <div class="flex flex-col gap-4 mb-4">
    <h2 class="text-xl md:text-2xl font-bold text-ink-1">Explorar por categoría</h2>

    <div class="flex gap-1.5 flex-wrap">
      @for (cat of categories(); track cat.id) {
        <button (click)="selectCategory(cat.id)"
                class="px-3.5 py-1.5 rounded-full border text-xs font-medium transition-all"
                [class.border-accent]="selectedId() === cat.id"
                [class.text-white]="selectedId() === cat.id"
                [class.border-line]="selectedId() !== cat.id"
                [class.text-ink-2]="selectedId() !== cat.id"
                [class.hover:border-accent]="selectedId() !== cat.id"
                [class.hover:text-ink-1]="selectedId() !== cat.id"
                [style.background-color]="selectedId() === cat.id ? 'var(--color-accent)' : ''">
          {{ cat.name }}
        </button>
      }
      @if (categories().length === 0) {
        @for (s of [1,2,3,4]; track s) {
          <div class="h-7 w-24 rounded-full bg-surface-3 animate-pulse"></div>
        }
      }
    </div>
  </div>
</div>

<!-- Carousel sin wrapper extra — usa su propio padding alineado -->
<app-product-carousel
  [title]="selectedName()"
  subtitle=""
  [products]="products()" />
