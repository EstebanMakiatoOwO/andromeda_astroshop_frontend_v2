<section class="border-b border-line"
         style="background: var(--color-accent-soft); border-color: color-mix(in oklch, var(--color-accent) 30%, transparent);">
  <div class="max-w-7xl mx-auto px-4 md:px-8 py-4 flex flex-col sm:flex-row items-start sm:items-center
              justify-between gap-4 sm:gap-6">

    <div class="flex items-center gap-3 md:gap-4">
      <div class="w-9 h-9 rounded-full flex items-center justify-center shrink-0 text-white font-mono text-sm"
           style="background-color: var(--color-accent);">
        ★
      </div>
      <div class="flex flex-col gap-0.5">
        <h3 class="text-sm font-semibold" style="color: var(--color-accent);">
          Sumá puntos cada vez que comprás
        </h3>
        <small class="text-xs hidden sm:block" style="color: var(--color-accent); opacity: 0.8;">
          Crear cuenta es opcional · ganás 1 pt cada $100 · canjeás por descuentos
        </small>
      </div>
    </div>

    <div class="flex items-center gap-2 shrink-0 w-full sm:w-auto">
      <button class="flex-1 sm:flex-none px-4 py-1.5 rounded-lg border border-line text-xs text-ink-2
                     hover:text-ink-1 hover:border-accent transition-colors text-center">
        Cómo funciona
      </button>
      <button class="flex-1 sm:flex-none px-4 py-1.5 rounded-lg text-xs font-medium text-white
                     transition-colors text-center"
              style="background-color: var(--color-accent);"
              onmouseenter="this.style.backgroundColor='var(--color-accent-hover)'"
              onmouseleave="this.style.backgroundColor='var(--color-accent)'">
        Crear cuenta
      </button>
    </div>
  </div>
</section>
