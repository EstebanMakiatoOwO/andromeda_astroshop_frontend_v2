<section class="border-t border-line py-10 md:py-14">

  <p class="font-mono text-[10px] text-ink-3 text-center uppercase tracking-widest mb-8">
    Algunas de las marcas  que manejamos
  </p>

  <div class="relative w-full overflow-hidden">
    <!-- Fade masks -->
    <div class="absolute left-0 top-0 bottom-0 w-28 z-10 pointer-events-none"
         style="background: linear-gradient(to right, var(--color-surface-1), transparent)"></div>
    <div class="absolute right-0 top-0 bottom-0 w-28 z-10 pointer-events-none"
         style="background: linear-gradient(to left, var(--color-surface-1), transparent)"></div>

    <div class="flex brand-scroll-track" style="width: max-content; gap: 10px;">
      @for (brand of track(); track $index) {
        <div class="flex flex-col items-center justify-center gap-1.5
                    px-5 py-3 rounded-xl border border-line bg-surface-2
                    hover:border-accent hover:bg-surface-3
                    transition-all cursor-pointer group shrink-0"
             style="height: 150px; min-width: 220px;">

          @if (brand.logoUrl) {
            <img [src]="brand.logoUrl | assetUrl"
                 [alt]="brand.name"
                 class="w-auto object-contain opacity-75 group-hover:opacity-100 transition-opacity"
                 style="max-height: 200px; max-width: 250px;" />
            <span class="font-mono text-[9px] text-ink-3 group-hover:text-accent
                         transition-colors whitespace-nowrap opacity-0 group-hover:opacity-100">
              {{ brand.name }}
            </span>z
          } @else {
            <span class="font-mono text-[11px] font-medium text-ink-2 group-hover:text-accent
                         transition-colors whitespace-nowrap text-center leading-snug">
              {{ brand.name }}
            </span>
          }

        </div>
      }
    </div>
  </div>

</section>
