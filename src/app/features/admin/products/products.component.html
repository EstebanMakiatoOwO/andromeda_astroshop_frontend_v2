<app-confirm-dialog
  [open]="showConfirmDelete()"
  title="¿Eliminar productos?"
  [message]="'Se eliminarán ' + selectedIds().size + ' producto' + (selectedIds().size !== 1 ? 's' : '') + ' de forma permanente.'"
  confirmLabel="Sí, eliminar"
  (confirmed)="confirmDelete()"
  (cancelled)="showConfirmDelete.set(false)"
/>

<div class="flex flex-col h-full">

  <app-products-filters
    [selectedCount]="selectedIds().size"
    [statusFilter]="statusFilter()"
    [availabilityFilter]="availabilityFilter()"
    [stockFilter]="stockFilter()"
    (searchChange)="onSearch($event)"
    (statusChange)="onStatusChange($event)"
    (availabilityChange)="onAvailabilityChange($event)"
    (stockChange)="onStockChange($event)"
    (deleteSelected)="onDeleteSelected()"
  />

  <div class="flex-1 overflow-auto">
    <app-products-table
      [products]="products()"
      [isLoading]="isLoading()"
      [selectedIds]="selectedIds()"
      (selectionChange)="onSelectionChange($event)"
    />
  </div>

  <app-products-pagination
    [page]="page()"
    [totalPages]="totalPages()"
    [totalElems]="totalElems()"
    [pageNumbers]="pageNumbers()"
    (pageChange)="setPage($event)"
  />

</div>
