<div class="rounded-xl border border-line bg-surface-3 p-4">
  <h4 class="text-sm font-semibold text-ink-1 mb-3">Precios y stock</h4>
  <div class="flex flex-col gap-3">

    <!-- Precios -->
    <div class="grid grid-cols-2 gap-3">
      <label class="flex flex-col gap-1">
        <small class="text-xs text-ink-3">Precio de venta (MXN)</small>
        <input
          type="number"
          [value]="price()"
          (input)="priceChange.emit(+$any($event.target).value)"
          class="h-8 px-3 rounded border border-line bg-surface-4 text-xs text-ink-1
                 outline-none focus:border-accent focus:ring-1 focus:ring-accent"
          min="0"
        />
      </label>
      <label class="flex flex-col gap-1">
        <small class="text-xs text-ink-3">Costo (MXN)</small>
        <input
          type="number"
          [value]="costPrice()"
          (input)="costPriceChange.emit(+$any($event.target).value)"
          class="h-8 px-3 rounded border border-line bg-surface-4 text-xs text-ink-1
                 outline-none focus:border-accent focus:ring-1 focus:ring-accent"
          min="0"
        />
      </label>
    </div>

    <!-- Stock -->
    <div class="grid grid-cols-2 gap-3">
      <label class="flex flex-col gap-1">
        <small class="text-xs text-ink-3">Stock actual</small>
        <input
          type="number"
          [value]="stock()"
          (input)="stockChange.emit(+$any($event.target).value)"
          class="h-8 px-3 rounded border border-line bg-surface-4 text-xs text-ink-1
                 outline-none focus:border-accent focus:ring-1 focus:ring-accent"
          min="0"
        />
      </label>
      <label class="flex flex-col gap-1">
        <small class="text-xs text-ink-3">Avisar si stock ≤</small>
        <input
          type="number"
          [value]="stockAlertThreshold()"
          (input)="stockAlertThresholdChange.emit(+$any($event.target).value)"
          class="h-8 px-3 rounded border border-line bg-surface-4 text-xs text-ink-1
                 outline-none focus:border-accent focus:ring-1 focus:ring-accent"
          min="0"
        />
      </label>
    </div>

    <!-- Flags -->
    <div class="flex gap-4 pt-1">
      <label class="flex items-center gap-2 cursor-pointer">
        <input
          type="checkbox"
          [checked]="isActive()"
          (change)="isActiveChange.emit($any($event.target).checked)"
          class="cursor-pointer accent-accent"
        />
        <span class="text-xs text-ink-2">Activo</span>
      </label>
      <label class="flex items-center gap-2 cursor-pointer">
        <input
          type="checkbox"
          [checked]="isCatalog()"
          (change)="isCatalogChange.emit($any($event.target).checked)"
          class="cursor-pointer accent-accent"
        />
        <span class="text-xs text-ink-2">Solo catálogo (a pedido)</span>
      </label>
    </div>

  </div>
</div>
