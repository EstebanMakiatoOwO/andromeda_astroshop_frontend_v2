@if (isLoading()) {
  <div class="flex items-center justify-center h-64 text-ink-3 text-sm font-mono">
    Cargando dashboard…
  </div>
}

@if (hasError() && !isLoading()) {
  <div class="flex items-center justify-center h-64">
    <div class="text-center">
      <p class="text-error text-sm font-semibold">No se pudo cargar el dashboard</p>
      <p class="text-ink-3 text-xs mt-1">Verificá la conexión con el servidor</p>
    </div>
  </div>
}

@if (!isLoading() && !hasError()) {

  <div class="p-5">
    <app-dashboard-kpis [kpis]="kpis" />

    <div class="grid grid-cols-[2fr_1fr] gap-4 mb-5">
      <app-dashboard-chart
        [period]="period()"
        [periods]="periods"
        [linePoints]="salesLinePoints()"
        [areaPath]="salesAreaPath()"
        [points]="chartPoints()"
        [dates]="salesDates()"
        (periodChange)="onPeriodChange($event)"
      />
      <app-dashboard-top-categories [categories]="topCategories" />
    </div>

    <div class="grid grid-cols-[1.5fr_1fr] gap-4">
      <app-dashboard-recent-orders
        [orders]="recentOrders"
        [datePreset]="dashDatePreset()"
        (datePresetChange)="onDatePresetChange($event)"
      />
      <app-dashboard-low-stock [products]="lowStock" [count]="lowStockCount" />
    </div>
  </div>
}
