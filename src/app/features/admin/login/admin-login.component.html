<!-- Full-page wrapper -->
<div
  class="relative flex items-center justify-center min-h-screen bg-surface-2 p-8 overflow-hidden"
>

  <!-- Subtle technical grid background -->
  <div
    class="absolute inset-0 pointer-events-none"
    style="
      background-image:
        linear-gradient(var(--color-line) 1px, transparent 1px),
        linear-gradient(90deg, var(--color-line) 1px, transparent 1px);
      background-size: 40px 40px;
      opacity: 0.4;
      mask-image: radial-gradient(ellipse at center, black 0%, transparent 70%);
      -webkit-mask-image: radial-gradient(ellipse at center, black 0%, transparent 70%);
    "
    aria-hidden="true"
  ></div>

  <!-- Theme toggle — floating top-right -->
  <button
    (click)="themeService.toggle()"
    class="absolute top-4 right-4 z-10 p-2 rounded-lg text-ink-3
           hover:text-ink-1 hover:bg-surface-4 transition-colors"
    [attr.aria-label]="themeService.isDark() ? 'Cambiar a modo claro' : 'Cambiar a modo oscuro'"
  >
    @if (themeService.isDark()) {
      <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="5"/>
        <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
      </svg>
    } @else {
      <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/>
      </svg>
    }
  </button>

  <!-- Content column -->
  <div class="relative z-10 flex flex-col gap-3.5 w-95">

    <!-- Header -->
    <div class="flex flex-col items-center gap-1.5 mb-2">
      <div class="flex items-center gap-2">
        <!-- Logo placeholder — reemplazar con tu logo -->
        <span class="text-sm font-bold tracking-widest text-ink-1 uppercase">Andromeda Astroshop</span>
        <span class="text-[10px] font-semibold px-1.5 py-0.5 rounded bg-warn-soft text-warn">
          admin
        </span>
      </div>
      <small class="font-mono text-[11px] text-ink-3">
        panel interno &middot; solo personal autorizado
      </small>
    </div>

    <!-- Card -->
    <div class="rounded-xl border border-line bg-surface-3 p-7">

      <h2 class="text-base font-semibold text-ink-1 mb-1">Iniciar sesión</h2>
      <small class="block text-xs text-ink-2 mb-4.5">
        Usá tu cuenta de equipo. ¿Eres cliente?
        <a class="text-accent cursor-pointer hover:underline">Ingresá acá</a>.
      </small>

      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" novalidate class="flex flex-col gap-3">

        <!-- Email -->
        <label class="flex flex-col gap-1">
          <small class="text-xs text-ink-2">Email corporativo</small>
          <input
            type="email"
            formControlName="email"
            autocomplete="email"
            placeholder="vos@andromeda.shop"
            class="w-full px-3 py-2 rounded-lg bg-surface-4 border text-sm text-ink-1
                   placeholder:text-ink-3 outline-none transition-colors
                   focus:border-accent focus:ring-1 focus:ring-accent"
            [class.border-line]="!emailField.invalid || !emailField.touched"
            [class.border-error]="emailField.invalid && emailField.touched"
          />
          @if (emailField.touched && emailField.hasError('required')) {
            <span class="text-[11px] text-error">El correo es obligatorio.</span>
          }
          @if (emailField.touched && emailField.hasError('email')) {
            <span class="text-[11px] text-error">Ingresá un correo válido.</span>
          }
        </label>

        <!-- Password -->
        <label class="flex flex-col gap-1">
          <div class="flex items-center justify-between">
            <small class="text-xs text-ink-2">Contraseña</small>
          </div>
          <input
            type="password"
            formControlName="password"
            autocomplete="current-password"
            placeholder="••••••••"
            class="w-full px-3 py-2 rounded-lg bg-surface-4 border text-sm text-ink-1
                   placeholder:text-ink-3 outline-none transition-colors
                   focus:border-accent focus:ring-1 focus:ring-accent"
            [class.border-line]="!passwordField.invalid || !passwordField.touched"
            [class.border-error]="passwordField.invalid && passwordField.touched"
          />
          @if (passwordField.touched && passwordField.hasError('required')) {
            <span class="text-[11px] text-error">La contraseña es obligatoria.</span>
          }
          @if (passwordField.touched && passwordField.hasError('minlength')) {
            <span class="text-[11px] text-error">Mínimo 8 caracteres.</span>
          }
        </label>

        <!-- Remember me -->
        <label class="flex items-center gap-2 text-xs text-ink-2 cursor-pointer">
          <input
            type="checkbox"
            formControlName="rememberMe"
            class="rounded border-line accent-accent"
          />
          Recordar este dispositivo por 24 hrs
        </label>

        <!-- Server error -->
        @if (errorMessage()) {
          <div class="flex items-center gap-2 px-3 py-2 rounded-lg bg-error-soft border border-error/30 text-xs text-error">
            <svg class="w-3.5 h-3.5 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
            </svg>
            {{ errorMessage() }}
          </div>
        }

        <!-- Submit -->
        <button
          type="submit"
          [disabled]="isLoading()"
          class="mt-1 w-full py-2.5 px-4 rounded-lg bg-accent hover:bg-accent-hover text-white
                 font-semibold text-sm transition-colors duration-200 disabled:opacity-50
                 disabled:cursor-not-allowed focus:outline-none focus:ring-2
                 focus:ring-accent focus:ring-offset-2 focus:ring-offset-surface-3"
        >
          @if (isLoading()) {
            <span class="flex items-center justify-center gap-2">
              <svg class="w-4 h-4 animate-spin" viewBox="0 0 24 24" fill="none">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" />
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z" />
              </svg>
              Verificando...
            </span>
          } @else {
            Ingresar
          }
        </button>

      </form>

    </div>

    <!-- Footer -->
    <div class="flex items-center justify-between px-1">
      <small class="text-[11px] text-ink-3">v 1.0.0 &middot; build 2026.05</small>
    </div>

  </div>
</div>
