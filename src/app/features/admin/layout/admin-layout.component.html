<div class="flex h-screen overflow-hidden bg-surface-1">

  <app-admin-sidebar />

  <div class="flex flex-col flex-1 min-w-0">
    <app-admin-topbar [crumbs]="breadcrumbs">
      <input
        class="h-[30px] w-[280px] px-3 rounded-lg bg-surface-4 border border-line text-xs
               text-ink-1 placeholder:text-ink-3 outline-none focus:border-accent
               focus:ring-1 focus:ring-accent transition-colors"
        placeholder="Buscar órdenes, productos, usuarios…"
      />
      <button
        class="flex items-center gap-1.5 h-[30px] px-3 rounded-lg border border-line
               bg-surface-4 text-xs text-ink-2 hover:text-ink-1 hover:bg-surface-3
               transition-colors whitespace-nowrap"
      >
        📦 Pendientes · 12
      </button>
      <button
        class="flex items-center justify-center w-[30px] h-[30px] rounded-lg border border-line
               bg-surface-4 text-ink-2 hover:text-ink-1 hover:bg-surface-3 transition-colors"
      >
        🔔
      </button>
    </app-admin-topbar>

    <main class="flex-1 overflow-y-auto p-6">
      <router-outlet />
    </main>
  </div>

</div>
