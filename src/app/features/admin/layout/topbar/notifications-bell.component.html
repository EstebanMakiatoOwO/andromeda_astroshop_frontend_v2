<button
  #bellBtn
  (click)="toggle()"
  class="relative flex items-center justify-center w-7.5 h-7.5 rounded-lg border border-line
         bg-surface-4 text-ink-2 hover:text-ink-1 hover:bg-surface-3 transition-colors"
>
  <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor"
       stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
    <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
  </svg>
  @if (localCount() > 0) {
    <span class="absolute -top-1 -right-1 min-w-4 h-4 px-1 rounded-full
                 bg-error text-white text-[10px] font-bold leading-4 text-center">
      {{ localCount() }}
    </span>
  }
</button>

<ng-template #panelTpl>
  <div
    class="bg-surface-2 border border-line rounded-lg shadow-2xl overflow-hidden"
    style="position:fixed;z-index:9999;width:288px;"
    [style.top]="dropdownTop()"
    [style.left]="dropdownLeft()"
  >
    <!-- Header -->
    <div class="flex items-center justify-between px-4 py-3 border-b border-line">
      <span class="text-sm font-semibold text-ink-1">Notificaciones</span>
      @if (localCount() > 0) {
        <button
          (click)="dismissAll()"
          class="text-[11px] text-accent hover:underline whitespace-nowrap"
        >
          Marcar todas como vistas
        </button>
      }
    </div>

    <!-- Reviews list -->
    @if (localReviews().length === 0) {
      <p class="px-4 py-5 text-xs text-ink-3 text-center">Sin notificaciones pendientes</p>
    } @else {
      <div class="flex flex-col divide-y divide-line max-h-80 overflow-y-auto">
        @for (r of localReviews(); track r.id) {
          <div class="px-4 py-3 flex flex-col gap-1 group relative">

            <!-- X button -->
            <button
              (click)="dismissOne(r)"
              class="absolute top-2 right-2 w-5 h-5 flex items-center justify-center
                     rounded text-ink-3 hover:text-error hover:bg-error-soft transition-colors
                     opacity-0 group-hover:opacity-100"
              title="Marcar como vista"
            >
              <svg class="w-3 h-3" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                   stroke-width="2.5" stroke-linecap="round">
                <path d="M18 6 6 18M6 6l12 12"/>
              </svg>
            </button>

            <div class="flex items-center justify-between pr-6">
              <span class="text-xs font-semibold text-ink-1">{{ r.userName }}</span>
              <span class="flex gap-0.5">
                @for (s of [1,2,3,4,5]; track s) {
                  <svg class="w-3 h-3" viewBox="0 0 24 24" fill="currentColor"
                       [class.text-warn]="s <= r.rating"
                       [class.text-surface-4]="s > r.rating">
                    <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
                  </svg>
                }
              </span>
            </div>
            <p class="text-[11px] text-ink-3 truncate">{{ r.productName }}</p>
            <p class="text-xs text-ink-2 line-clamp-2">{{ r.comment }}</p>
          </div>
        }
      </div>
      <div class="px-4 py-2.5 border-t border-line">
        <button
          (click)="goToReviews()"
          class="w-full text-center text-xs text-accent hover:underline"
        >
          Ver todas las reseñas →
        </button>
      </div>
    }
  </div>
</ng-template>
