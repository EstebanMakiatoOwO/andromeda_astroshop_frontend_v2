<div class="relative overflow-hidden border-b border-line flex items-center"
     [style.min-height.px]="minHeight()"
     [style.background]="bgStyle()">

  @if (dark()) {
    <app-star-field [count]="stars()" [seed]="13" />
  }

  <!-- Anillo orbital decorativo -->
  <div class="absolute rounded-full border pointer-events-none"
       [style.border-color]="orbitColor()"
       style="width:540px; height:540px; top:50%; right:-180px; transform:translateY(-50%); opacity:0.5">
  </div>

  <div class="relative z-10 w-full max-w-5xl mx-auto px-6 md:px-10 py-14 md:py-20">
    <div class="flex flex-col gap-4 max-w-2xl">

      @if (kicker()) {
        <span class="font-mono text-xs" [style.color]="kickerColor()">{{ kicker() }}</span>
      }

      <h1 class="text-3xl md:text-4xl lg:text-5xl font-bold leading-tight"
          [style.color]="dark() ? '#fff' : 'var(--color-ink-1)'">
        {{ title() }}
      </h1>

      @if (desc()) {
        <p class="text-sm md:text-base leading-relaxed max-w-xl"
           [style.color]="dark() ? 'oklch(0.82 0.03 275)' : 'var(--color-ink-2)'">
          {{ desc() }}
        </p>
      }

      @if (ctas().length > 0) {
        <div class="flex gap-3 flex-wrap mt-1">
          @for (cta of ctas(); track cta; let i = $index) {
            <button (click)="ctaClick.emit(i)"
                    class="px-5 py-2.5 rounded-lg text-sm font-medium transition-colors"
                    [style]="ctaStyle(i)">
              {{ cta }}
            </button>
          }
        </div>
      }

      <ng-content />

    </div>
  </div>
</div>
