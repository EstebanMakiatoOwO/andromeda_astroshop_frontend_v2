<app-landing-hero
  kicker="// hablemos"
  title="Contacto"
  desc="¿Dudas sobre un producto, una experiencia o quieres llevar AstroDome a tu evento? Escríbenos y te respondemos a la brevedad."
  [dark]="false"
  [minHeight]="260"
/>

<div class="max-w-5xl mx-auto px-4 md:px-8 py-14">
  <div class="grid grid-cols-1 md:grid-cols-[1.3fr_1fr] gap-8 items-start">

    <!-- Formulario -->
    <div class="rounded-xl border border-line bg-surface-2 p-6 flex flex-col gap-5">
      <div class="flex flex-col gap-1">
        <h3 class="text-base font-semibold text-ink-1">Envianos un mensaje</h3>
        <p class="font-mono text-[11px] text-ink-3">→ {{ emailDestino() }}</p>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div class="flex flex-col gap-1.5">
          <label class="font-mono text-[10px] text-ink-3">nombre *</label>
          <input class="h-9 px-3 rounded-lg border border-line bg-surface-3 text-xs text-ink-1
                        outline-none focus:border-accent transition-colors"
                 placeholder="Tu nombre"
                 [value]="nombre()"
                 (input)="nombre.set($any($event.target).value)" />
        </div>
        <div class="flex flex-col gap-1.5">
          <label class="font-mono text-[10px] text-ink-3">email *</label>
          <input type="email"
                 class="h-9 px-3 rounded-lg border border-line bg-surface-3 text-xs text-ink-1
                        outline-none focus:border-accent transition-colors"
                 placeholder="tu@email.com"
                 [value]="email()"
                 (input)="email.set($any($event.target).value)" />
        </div>
      </div>

      <div class="flex flex-col gap-2">
        <label class="font-mono text-[10px] text-ink-3">¿sobre qué quieres hablar?</label>
        <div class="flex flex-wrap gap-2">
          @for (t of temas; track t) {
            <button (click)="temaActivo.set(t)"
                    class="px-3 py-1.5 rounded-full text-xs border transition-colors"
                    [class.border-accent]="temaActivo() === t"
                    [class.text-accent]="temaActivo() === t"
                    [class.bg-accent-soft]="temaActivo() === t"
                    [class.border-line]="temaActivo() !== t"
                    [class.text-ink-2]="temaActivo() !== t">
              {{ t }}
            </button>
          }
        </div>
      </div>

      <div class="flex flex-col gap-1.5">
        <label class="font-mono text-[10px] text-ink-3">mensaje *</label>
        <textarea rows="5"
                  class="px-3 py-2.5 rounded-lg border border-line bg-surface-3 text-xs text-ink-1
                         outline-none focus:border-accent transition-colors resize-y"
                  placeholder="Contanos en qué te podemos ayudar…"
                  [value]="mensaje()"
                  (input)="mensaje.set($any($event.target).value)"></textarea>
      </div>

      <a [href]="mailtoUrl()"
         class="self-start px-5 py-2.5 rounded-lg text-sm font-medium text-white transition-colors"
         style="background-color:var(--color-accent)"
         onmouseenter="this.style.backgroundColor='var(--color-accent-hover)'"
         onmouseleave="this.style.backgroundColor='var(--color-accent)'">
        Enviar mensaje →
      </a>
    </div>

    <!-- Datos directos -->
    <div class="flex flex-col gap-4">
      <div class="rounded-xl border border-line bg-surface-2 p-5 flex flex-col gap-4">
        <h4 class="text-sm font-semibold text-ink-1">Datos directos</h4>
        @for (c of datos; track c.tipo) {
          <div class="flex gap-3 items-start">
            <div class="w-9 h-9 rounded-lg bg-surface-3 border border-line flex items-center justify-center text-base shrink-0">
              {{ c.ico }}
            </div>
            <div class="flex flex-col gap-0.5">
              <small class="font-mono text-[10px] text-ink-3">{{ c.tipo }}</small>
              <strong class="text-xs text-ink-1 break-all">{{ c.valor }}</strong>
              @if (c.sub) {
                <small class="text-xs text-ink-2">{{ c.sub }}</small>
              }
            </div>
          </div>
        }
      </div>
    </div>

  </div>
</div>
