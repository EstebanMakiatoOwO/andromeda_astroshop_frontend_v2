<header class="border-b border-line bg-surface-1 sticky top-0 z-50">

  <!-- Topbar -->
  <div class="max-w-7xl mx-auto px-4 md:px-6 h-14 flex items-center gap-4">
    <a routerLink="/" class="shrink-0">
      <app-logo [size]="22" />
    </a>
    <div class="flex-1"></div>
    <span class="font-mono text-[10px] text-ink-3 flex items-center gap-2">
      <svg class="w-3 h-3" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
      </svg>
      conexión segura
    </span>
  </div>

  <!-- Steps -->
  @if (step() !== null) {
    <div class="border-t border-line">
      <div class="max-w-3xl mx-auto px-4 py-3 flex items-center justify-center gap-0">
        @for (s of steps; track s.n; let i = $index; let last = $last) {
          <div class="flex items-center gap-2">
            <span class="w-6 h-6 rounded-full flex items-center justify-center text-[11px] font-semibold shrink-0 transition-colors"
                  [class.bg-ink-1]="stateOf(s.n) === 'active'"
                  [class.text-surface-1]="stateOf(s.n) === 'active'"
                  [class.bg-success]="stateOf(s.n) === 'done'"
                  [class.text-white]="stateOf(s.n) === 'done'"
                  [class.bg-surface-3]="stateOf(s.n) === 'next'"
                  [class.text-ink-3]="stateOf(s.n) === 'next'">
              {{ stateOf(s.n) === 'done' ? '✓' : s.n }}
            </span>
            <span class="text-xs whitespace-nowrap transition-colors"
                  [class.text-ink-1]="stateOf(s.n) !== 'next'"
                  [class.font-medium]="stateOf(s.n) === 'active'"
                  [class.text-ink-3]="stateOf(s.n) === 'next'">
              {{ s.label }}
            </span>
          </div>
          @if (!last) {
            <div class="w-10 h-px bg-line mx-3 shrink-0"></div>
          }
        }
      </div>
    </div>
  }

</header>
