<html lang="en">

  <!-- Open Graph (redes sociales y Google) -->

  <meta property="og:site_name"   content="Andrómeda AstroShop">
  <meta property="og:title"       content="Andrómeda AstroShop — Telescopios y Astrofotografía en México">

  <!-- Prevent flash of wrong theme before Angular boots -->
  <script>
    (function () {
      var t = localStorage.getItem('astroshop_theme') ?? 'dark';
      if (t === 'light') document.documentElement.classList.add('light');
    })();
  </script>
