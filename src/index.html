<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>AndromedaAstroshopV2</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <!-- Prevent flash of wrong theme before Angular boots -->
  <script>
    (function () {
      var t = localStorage.getItem('astroshop_theme') ?? 'dark';
      if (t === 'light') document.documentElement.classList.add('light');
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
