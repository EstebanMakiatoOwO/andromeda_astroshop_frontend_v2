server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # ── Headers de seguridad ─────────────────────────────────────────────────
    add_header X-Frame-Options            "SAMEORIGIN"                           always;
    add_header X-Content-Type-Options     "nosniff"                              always;
    add_header X-XSS-Protection           "1; mode=block"                        always;
    add_header Referrer-Policy            "strict-origin-when-cross-origin"      always;
    add_header Permissions-Policy         "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Strict-Transport-Security  "max-age=31536000; includeSubDomains"  always;

    # CSP — ajusta el dominio del API si cambia
    add_header Content-Security-Policy
        "default-src 'self'; \
         script-src 'self'; \
         style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; \
         font-src 'self' https://fonts.gstatic.com data:; \
         img-src 'self' data: blob: https:; \
         connect-src 'self' https://api.andromedaastroshop.com; \
         frame-ancestors 'none';"
        always;

    # ── Gzip ─────────────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/font-woff2;

    # ── Assets estáticos con caché larga ─────────────────────────────────────
    location ~* \.(js|css|woff2?|ttf|eot|ico|svg|webp|png|jpg|jpeg|gif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # ── SPA: todas las rutas van al index.html ────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Bloquear acceso a archivos ocultos ────────────────────────────────────
    location ~ /\. {
        deny all;
    }
}
